# Fly.io app configuration (unchanged app name and region). Port 8888 is the plain relay port of the
# stock game; port 8889 is TLS since 29 Sep 2026 (plan §20): the Fly proxy terminates TLS with the
# app's dark-colony-server.fly.dev certificate and forwards plaintext to the same relay, which is what
# the patched Dark Colony Ultimate exe's ONLINE WAR connects to (DEFAULT_SERVER.TXT). Until then 8889
# was a second plain port (dc16.exe retries it when 8888 fails; that fallback is gone on Fly).
app = "dark-colony-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8888"
  # the battle engine beside the relay puts Mercenary's 0x08 checksum into every sync frame (plan §18);
  # verified with the real game on 11 Sep 2026
  SYNC_CHECK = "send"
  # every battle leaves a compact, lossless recording in the log (about 10 KB per game-minute) that
  # `node tools/logs2replay.js --fetch dark-colony-server` rebuilds for tools/replay.js while Fly still
  # holds the lines (about seven days)
  RECORD_LOG = "on"
  # since 2 Oct 2026 every battle is also recorded as a file on the volume below: these are the
  # battles REPLAY ONLINE GAME in Dark Colony Ultimate offers (plan §21); the newest 50 are kept
  RECORD_DIR = "/data/replays"
  REPLAY_KEEP = "50"

# 1 GB persistent disk (`fly volumes create dc_replays --region iad --size 1`, 2 Oct 2026) for the
# recordings; one volume per machine, so the app stays a single machine
[mounts]
  source = "dc_replays"
  destination = "/data"

[[services]]
  internal_port = 8888
  processes = ["app"]
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 50
    soft_limit = 30

  [[services.ports]]
    port = 8888
  [[services.ports]]
    port = 8889
    handlers = ["tls"]

# Optional, only once the basics work. Never a check on 8888 (a probe would take a lobby slot).
# [checks.health]
#   type = "tcp"
#   port = 8080                  # set HEALTH_PORT=8080 in [env]
#   interval = "15s"
#   timeout = "5s"
#   grace_period = "10s"
