# Fly.io app configuration (unchanged app name and region; port 8889 added: dc16.exe retries it when 8888 fails)
app = "dark-colony-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8888"
  # the battle engine beside the relay puts Mercenary's 0x08 checksum into every sync frame (plan §18);
  # verified with the real game on 11 Sep 2026
  SYNC_CHECK = "send"
  # every battle leaves a compact, lossless recording in the log (about 10 KB per game-minute) that
  # `node tools/logs2replay.js --fetch dark-colony-server` rebuilds for tools/replay.js while Fly still
  # holds the lines (about seven days); the machine has no volume, so RECORD_DIR would be lost
  RECORD_LOG = "on"

[[services]]
  internal_port = 8888
  processes = ["app"]
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 50
    soft_limit = 30

  [[services.ports]]
    port = 8888
  [[services.ports]]
    port = 8889

# Optional, only once the basics work. Never a check on 8888 (a probe would take a lobby slot).
# [checks.health]
#   type = "tcp"
#   port = 8080                  # set HEALTH_PORT=8080 in [env]
#   interval = "15s"
#   timeout = "5s"
#   grace_period = "10s"
